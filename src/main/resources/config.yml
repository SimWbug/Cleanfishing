# ============================================================
#  CleanFishing - configuration
# ============================================================

game:
  # Durée d'une journée en secondes (10 min par défaut)
  day-duration-seconds: 600
  # Compte à rebours avant le début de la partie quand assez de joueurs ont rejoint
  lobby-countdown-seconds: 20
  # Pause entre deux journées réussies (la boutique de Gertrude reste ouverte)
  intermission-seconds: 30
  min-players: 1
  max-players: 8
  # Symbole de la monnaie affichée
  currency-symbol: "$"
  # Paliers des premières journées. Au-delà, le dernier palier est multiplié par growth à chaque journée.
  targets: [500, 1500, 3000, 5000, 8000]
  target-growth-after-list: 1.35
  # % de la cagnotte restante à la fin de la pause reporté sur la journée suivante (0 = tout est perdu : dépense-la chez Gertrude !)
  carry-over-percent: 0
  # Part des joueurs qui doivent valider auprès de Francis pour finir la journée (1.0 = tous)
  francis-vote-ratio: 1.0
  # Nombre d'offres dans la boutique de Gertrude chaque journée
  shop-offers-per-day: 5
  # Canne à pêche donnée au début de la partie : durée de l'enchantement Appât (Lure) 0-5
  rod-lure-level: 2

difficulty:
  # À partir de cette journée, les paliers montent plus vite... mais les poissons rapportent plus.
  ramp-from-day: 5
  extra-target-growth: 1.15      # palier x1.15 de plus à chaque journée à partir de ramp-from-day
  value-bonus-per-day: 0.05      # +5 % de valeur des poissons par journée à partir de ramp-from-day

hardcore:
  # Mode voté dans la salle d'attente (majorité des joueurs). Classement à part.
  enabled: true
  target-multiplier: 1.5         # paliers x1.5
  day-duration-multiplier: 0.8   # journées 20 % plus courtes
  value-multiplier: 1.25         # poissons payés x1.25 (pas de report de cagnotte en hardcore)

levels:
  # Niveaux par partie : chaque prise rapporte de l'expérience (barre d'XP du joueur), remise à zéro à chaque partie.
  enabled: true
  xp-base: 60          # XP pour passer du niveau 0 au niveau 1
  xp-growth: 1.25      # chaque niveau demande 25 % d'XP en plus
  xp:
    common: 10
    uncommon: 18
    rare: 35
    epic: 70
    legendary: 150
    item: 6

cards:
  # Cartes de pouvoir en 3D qui apparaissent devant le joueur : il vise une carte et clique pour la prendre.
  count: 3             # nombre de cartes proposées (2 à 4)
  every: [2, 3]        # une carte tous les 2 puis 3 niveaux (niveaux 2, 5, 7, 10, 12...)
  timeout-seconds: 30  # au-delà, la carte visée (ou une au hasard) est prise automatiquement
  # Désactiver un pouvoir : cards.powers.<nom>.enabled: false
  # (luck, fast_bite, double_pay, gold_fever, scholar, double_hook, treasure, pocket_timer, tip, friend, quick_hands, abyss_call)
  powers: {}

events:
  # Événements aléatoires pendant une journée, annoncés par un titre à l'écran.
  enabled: true
  per-day: 2
  from-day: 1
  golden-shoal:          # banc de poissons dorés : valeur x2
    enabled: true
    weight: 3
    duration-seconds: 60
    value-multiplier: 2.0
  storm:                 # tempête : ça mord moins vite, mais plus de poissons rares
    enabled: true
    weight: 2
    duration-seconds: 90
    bite-multiplier: 1.5
    luck-multiplier: 2.0
  fog:                   # brouillard : vision réduite, poissons rares plus fréquents
    enabled: true
    weight: 2
    duration-seconds: 90
    luck-multiplier: 1.6
    darkness: 1          # 0 = pas d'effet d'obscurité
  low-tide:              # marée basse : ça mord vite, plus d'objets pêchés
    enabled: true
    weight: 2
    duration-seconds: 60
    bite-multiplier: 0.5
    item-chance-multiplier: 2.0

upgrades:
  # Améliorations permanentes (pour la partie) achetées chez Gertrude. Une entrée de 'prices' = un niveau.
  rod:
    prices: [400, 900]
    bite-faster-per-level: 0.15   # -15 % de temps d'attente par niveau
    luck-per-level: 0.25          # +25 % de chances de poissons rares par niveau
  boots:
    prices: [250, 600]            # vitesse I puis II
  bag:
    prices: [350, 800]
    extra-fish-chance-per-level: 0.15   # 15 % (niv. 1) / 30 % (niv. 2) de chances d'un poisson en plus

ambience:
  enabled: true
  # Musique jouée au début de chaque journée (catégorie Musique). Clé d'un son vanilla ou de ton resource pack.
  music: "music.under_water"
  music-volume: 0.6
  day-start-sound: "item.goat_horn.sound.0"
  seagull-sound: "entity.parrot.ambient"
  waves-sound: "block.water.ambient"
  fireworks: true

leaderboard:
  # Panneau flottant : /cfish admin setboard <arène> (ou le bouton dans les outils admin)
  refresh-seconds: 60

resource-pack:
  # Interfaces illustrées (boutique de Gertrude avec portrait 3D et bulle, Francis). Les joueurs sans le pack
  # gardent les interfaces classiques. Le pack s'AJOUTE aux autres packs du serveur.
  enabled: false
  # 1) Le plus simple : le plugin sert lui-même le pack. Ouvre ce port (TCP) sur ta box / ton hébergeur
  #    et mets l'adresse publique du serveur (ex. cle4nergang.fr).
  self-host:
    enabled: true
    port: 8164
    public-address: ""
  # 2) Ou téléverse plugins/CleanFishing/CleanFishing-pack.zip ailleurs et mets son lien direct ici
  #    (le sha1 est calculé à partir du dossier pack/ ; renseigne-le seulement si tu téléverses un autre zip).
  url: ""
  sha1: ""
  # Quand l'envoyer : "game" (en rejoignant une partie) ou "join" (à la connexion au serveur)
  send-on: game
  required: false
  prompt: "<aqua>CleanFishing <gray>: interfaces illustrées de Gertrude et Francis"
  # true si tu as fusionné le pack dans le resource pack principal de ton serveur
  assume-loaded: false

zone:
  # Zone de jeu = disque autour du spawn de l'arène, de ce rayon en blocs (toutes hauteurs).
  # Les monstres hostiles n'y apparaissent pas. Rayon propre à une arène : /cfish admin setradius <arène> <rayon>
  default-radius: 60
  # true  = zone protégée en permanence (recommandé : pas de monstres accumulés avant la partie)
  # false = protégée seulement quand une partie existe sur l'arène
  block-hostile-always: true

hut:
  # Quand on place Gertrude (interface admin ou /cfish admin setgertrude), un cabanon de pêcheur est construit autour d'elle.
  auto-build: true
  wall: SPRUCE_PLANKS
  floor: OAK_PLANKS
  pillar: OAK_LOG
  counter: SPRUCE_PLANKS
  # Bois du toit : DARK_OAK, SPRUCE, OAK, BIRCH, ACACIA, CHERRY...
  roof-wood: DARK_OAK

hotbar:
  # Objet "Choisir une île" donné dans la salle d'attente (comme la tête de FindThePoulet).
  # Pour une vraie tête de poisson : colle dans 'texture' la valeur base64 d'une tête
  # (minecraft-heads.com, champ "Value"). Si 'texture' est vide, 'fallback-material' est utilisé.
  menu-item:
    texture: ""
    fallback-material: TROPICAL_FISH
  # Tête « Choisir une île » donnée HORS partie (slot 2 de la hotbar) pour rejoindre le jeu depuis le hub.
  # Elle ne remplace jamais un autre objet. 'worlds' vide = tous les mondes ; sinon seulement ceux listés.
  hub-item:
    enabled: true
    worlds: []

npc:
  gertrude:
    name: "Gertrude"
    description: "Tavernière - Boutique"
    # Skin : soit un pseudo Minecraft (résolu par le serveur) ...
    skin-name: ""
    # ... soit une texture exacte (valeur + signature base64, par ex. depuis mineskin.org). Prioritaire si remplie.
    skin-texture: ""
    skin-signature: ""
  francis:
    name: "Francis"
    description: "Pêcheur des mers - Finir la journée"
    skin-name: ""
    skin-texture: ""
    skin-signature: ""

loot:
  # Probabilité qu'une prise soit un objet (dynamite, filet, ...) au lieu d'un poisson
  item-chance: 0.12
  # Poids des objets pêchables
  item-pool:
    DYNAMITE: 3
    NET: 3
    BAIT: 4
    LUCKY_CHARM: 2
    HARPOON: 1
  # Effet du porte-bonheur : multiplicateur de poids pour les poissons rare / épique / légendaire
  lucky-charm-multiplier: 2.5
  # Nombre de prises pendant lesquelles dure un porte-bonheur / un appât
  lucky-charm-casts: 5
  bait-casts: 5
  # Appât : réduit le temps d'attente (ticks max d'attente de la touche)
  bait-max-wait-ticks: 100

items:
  dynamite:
    # Rayon de l'explosion (aucun bloc détruit) et nombre de poissons remontés
    radius: 4.0
    min-fish: 3
    max-fish: 8
    fuse-ticks: 40
  net:
    min-fish: 2
    max-fish: 4
    cooldown-seconds: 20
  harpoon:
    # Portée en blocs ; remonte 1 poisson d'une rareté minimale garantie (COMMON, UNCOMMON, RARE, EPIC, LEGENDARY)
    range: 12
    cooldown-seconds: 12
    min-rarity: RARE
  sand-timer:
    # Secondes ajoutées à la journée en cours
    bonus-seconds: 60
  golden-lure:
    casts: 3
  dynamite-crate:
    min-fish: 8
    max-fish: 14

shop:
  # Chaque lot ne s'achète qu'une fois : acheté, il disparaît de l'étal (pour toute l'équipe)
  single-purchase: true
  # Un même objet peut apparaître plusieurs fois dans l'étal du jour (ex. 2 lots d'appâts), au plus :
  max-same-item: 2
  # Une promotion par jour sur un article au hasard
  deal:
    enabled: true
    percent: 30
  # Le 5e article est un article rare, en un seul exemplaire pour toute l'équipe
  rare:
    enabled: true
    stock: 1
  rare-pool:
    GOLDEN_LURE:    { price: 450, weight: 5, amount: 1 }
    DYNAMITE_CRATE: { price: 550, weight: 4, amount: 1 }
    SAND_TIMER:     { price: 320, weight: 2, amount: 2 }
  # Relancer les 5 articles de Gertrude : payé avec la cagnotte, prix croissant. Remis à zéro chaque journée.
  reroll:
    base-price: 40       # prix du 1er changement
    price-step: 40       # augmentation à chaque changement de la journée
    max-per-day: 0       # 0 = illimité
  # Prix et poids de chaque article dans le pool de la boutique
  pool:
    DYNAMITE:    { price: 150, weight: 10 }
    NET:         { price: 120, weight: 10 }
    HARPOON:     { price: 220, weight: 6 }
    BAIT:        { price: 80,  weight: 12 }
    LUCKY_CHARM: { price: 180, weight: 8 }
    SAND_TIMER:  { price: 250, weight: 5 }
  # Nombre d'exemplaires achetés d'un coup
  stack-size:
    DYNAMITE: 3
    NET: 2
    HARPOON: 2
    BAIT: 3
    LUCKY_CHARM: 1
    SAND_TIMER: 1

# Répliques de Gertrude et Francis (texte simple, sans couleurs). Laisse vide pour garder celles par défaut.
# Situations : gertrude.greet / poor / reached / hurry / intermission / hardcore / thanks / broke / reroll / soldout
#              gertrude.event.golden-shoal / storm / fog / low-tide ; francis.not-reached / reached / hurry / voted
# Exemple :
# dialogue:
#   gertrude:
#     greet: ["Bienvenue chez Gertrude !", "Qu'est-ce qui te ferait plaisir ?"]
dialogue: {}

debug:
  # true = écrit dans la console chaque clic sur Gertrude / Francis (aide au diagnostic)
  npc-clicks: false
