name: CleanFishing
version: '${version}'
main: fr.cleangang.cleanfishing.CleanFishingPlugin
api-version: '26.3'
authors: [Simon]
description: Mini-jeu de pêche coopératif par journées, avec boutique, objets et codex.
commands:
  cfish:
    description: Commandes CleanFishing
    usage: /cfish <join|leave|codex|menu|titres|top|pouvoirs|admin>
    aliases: [cleanfishing, pechejeu]
permissions:
  cleanfishing.play:
    description: Jouer à CleanFishing
    default: true
  cleanfishing.admin:
    description: Administrer CleanFishing
    default: op
