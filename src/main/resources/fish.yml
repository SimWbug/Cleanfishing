# ============================================================
#  Catalogue des poissons (codex inclus)
#  rarity : COMMON, UNCOMMON, RARE, EPIC, LEGENDARY
#  material : icône par défaut (vanilla)
#  item-model : (optionnel) clé d'un modèle 3D fourni par ton resource pack, ex. "cleangang:fish/crabe".
#               Laisse vide tant que le pack n'est pas installé, sinon le client affichera un modèle manquant.
#  value : valeur de base ; elle est multipliée selon la taille tirée (min-size .. max-size, en cm)
#  weight : probabilité relative d'être pêché
# ============================================================
